<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-black to-gray-800 text-white flex items-center justify-center h-screen" data-page="scan-result">

    <div id="ticketCard" class="hidden bg-white/10 backdrop-blur-lg p-8 rounded-2xl w-[350px] text-center shadow-lg">

        <h2 class="text-2xl font-bold mb-4 text-green-400">🎟 Ticket Verified</h2>

        <p class="mb-2"><b>Event:</b> <span id="ticketEvent"></span></p>
        <p class="mb-2"><b>Ticket ID:</b> <span id="ticketId"></span></p>

        <hr class="my-4 border-white/20">

        <p><b>Name:</b> <span id="ticketName"></span></p>
        <p><b>Email:</b> <span id="ticketEmail"></span></p>
        <p><b>Mobile:</b> <span id="ticketMobile"></span></p>
        <p><b>Age:</b> <span id="ticketAge"></span></p>
        <p><b>Address:</b> <span id="ticketAddress"></span></p>

        <div class="mt-4 text-green-400 font-bold">
            ✅ Entry Allowed
        </div>

    </div>

<script src="/config.js"></script>
<script defer src="/app.js"></script>
</body>

</html>
